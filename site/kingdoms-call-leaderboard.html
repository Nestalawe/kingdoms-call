<script>
// ── BOOT-FAILURE REPORTER ── mirrors the two portals: the first uncaught error replaces the
// spinner with the message and a hint, so a boot failure is never a silent "Loading…".
(function(){
  let shown=false;
  function hint(m){
    if(/supabase is not defined/i.test(m)) return 'The Supabase library could not be downloaded from cdn.jsdelivr.net or unpkg.com. Check your internet connection, ad-blocker or firewall, then reload.';
    return 'Hard-reload the page (Ctrl/Cmd+Shift+R). If it persists, report the message above.';
  }
  function show(msg){
    if(shown) return;
    const go=()=>{
      const sp=document.getElementById('spinner');
      if(!sp||sp.style.display==='none') return;
      shown=true;
      const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
      sp.innerHTML='<div style="max-width:640px;margin:auto;text-align:left;font-family:\'Crimson Text\',serif;letter-spacing:0;color:#f2e8d0;border:1px solid #7a1c1c;border-radius:4px;padding:14px 18px;background:#1a0c0c">'
        +'<div style="font-family:\'Cinzel\',serif;color:#e8b84b;margin-bottom:6px">⚠ The Hall of Fame could not start</div>'
        +'<div style="font-family:monospace;font-size:.8rem;color:#f0c0c0;word-break:break-word;margin-bottom:8px">'+esc(msg)+'</div>'
        +'<div style="font-size:.9rem">'+hint(msg)+'</div>'
        +'<div style="margin-top:10px"><button onclick="location.reload()" style="padding:6px 14px;background:#7a1c1c;color:#fff;border:none;border-radius:3px;cursor:pointer;font-family:\'Cinzel\',serif">Reload</button></div></div>';
    };
    if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',go); else go();
  }
  window.addEventListener('error',e=>show(e.message||String(e.error||'Unknown error')));
  window.addEventListener('unhandledrejection',e=>show((e.reason&&(e.reason.message||e.reason))||'Unhandled promise rejection'));
})();
</script>

// ══════════════════════════════════════════════════════════════════════════════════════════════
// KINGDOMS CALL — HALL OF FAME
// ══════════════════════════════════════════════════════════════════════════════════════════════
// Reads ONE table, public.game_records: one row per finished game, written by the GM portal when
// the game ends (or by its "Record missing games" button). Every figure on this page was computed
// there, where the engine's tables live; this page only filters, merges and ranks. That is
// deliberate — the alternative, reading turn_events here, is tens of megabytes per visit and would
// repeat the 2026-09-25 Disk-IO fault.
//
// GM MODE. Opened from the GM portal the link carries ?gm=1. Edit controls appear only if the
// signed-in account is a real GM (it owns at least one row in `games`), and the table's own policy
// enforces the same thing server-side, so ?gm=1 by itself grants nothing.
if(typeof KC_CONFIG==='undefined') throw new Error('kc-config.js did not load: reload the page.');
const SUPABASE_URL = KC_CONFIG.supabaseUrl;
const SUPABASE_ANON_KEY = KC_CONFIG.supabaseKey;
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let GAMES=[], TAB='champions', GM=false, ME=null, PEOPLE={};
// ── REALM ≠ PLAYER ────────────────────────────────────────────────────────────────────────────
// A realm name is per game — the same person rules Aranthia one season and the Vale the next. The
// PERSON is their auth account, and their name lives in `profiles.name`. Every player statistic on
// this board is keyed on that id (`uid` in the standings) and printed with the name the profile
// carries RIGHT NOW, so renaming yourself renames your whole history instead of splitting it.
// `PEOPLE` is that lookup; if it cannot be read (signed out, or RLS), each standing's stored
// `player` — the name at the time the game ended — is used instead.
// The stored `player` is only a fallback for when profiles cannot be read. A row written by the
// FIRST build (lb1) put the KINGDOM name in that field, so a legacy row would otherwise print the
// realm twice. Any stored name equal to the realm is therefore refused outright — it is either
// that bug or a realm named after its ruler, and in both cases it tells the reader nothing.
const personName=st=>{
  if(!st) return null;
  if(st.uid&&PEOPLE[st.uid]) return PEOPLE[st.uid];
  if(st.player&&st.player!==st.realm) return st.player;
  return null;
};
const isLegacyRow=g=>!(g&&/lb[2-9]/.test(String(g.build||'')))||!(g&&(g.standings||[]).some(st=>st&&!st.bot&&st.uid));
// A record points at a realm by index; who that was lives once, in its game's standings.
function whoOf(e){
  const st=(e.g&&e.g.standings||[]).find(x=>x&&x.pi===e.pi);
  if(st) return {realm:st.realm, player:personName(st), race:st.race, al:st.al, bot:!!st.bot, uid:st.uid||null};
  // a row written by the first build (lb1) carried the identity on the record itself
  return {realm:e.realm||null, player:e.player||null, race:e.race||null, al:e.al||null, bot:!!e.bot, uid:null};
}
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const $=id=>document.getElementById(id);
const nf=n=>(n==null||!isFinite(n))?'—':Number(n).toLocaleString('en-NZ',{maximumFractionDigits:2});
const dstr=s=>{ if(!s) return '—'; const d=new Date(s); return isNaN(d)?'—':d.toLocaleDateString('en-NZ',{day:'numeric',month:'short',year:'numeric'}); };

const POWER_WORD=['—','Weak','Moderate','Powerful','Legendary'];
function achDef(key){
  if(KC_ACH[key]) return KC_ACH[key];
  if(key.indexOf('sk_')===0) return {c:'skills',l:null,f:'int'};
  if(key.indexOf('title_')===0) return {c:'titles',l:null,f:'int'};
  return {c:'other',l:null,f:'int'};
}
function achLabel(key,rec){
  if(rec&&rec.lbl) return rec.lbl;
  const d=KC_ACH[key];
  if(d&&d.l) return d.l;
  return key.replace(/^sk_/,'Highest ').replace(/^title_/,'Title: ').replace(/_/g,' ').replace(/^./,c=>c.toUpperCase());
}
function fmtVal(v,f){
  if(v==null) return '—';
  switch(f){
    case 'pct': return nf(v)+'%';
    case 'x': return nf(v)+'×';
    case 'power': return POWER_WORD[Math.max(0,Math.min(4,Math.round(v)))]||nf(v);
    case 'hp': return nf(v)+' hp';
    case 'turn': return 'turn '+nf(v);
    default: return nf(v);
  }
}

// ── LOADING ───────────────────────────────────────────────────────────────────────────────────
async function loadAll(force){
  const msg=$('msg');
  try{
    const {data:{session}}=await sb.auth.getSession();
    ME=session?session.user:null;
  }catch(e){ ME=null; }
  GM=false;
  if(ME&&new URLSearchParams(location.search).get('gm')==='1'){
    try{
      const {data}=await sb.from('games').select('id').eq('gm_user_id',ME.id).limit(1);
      GM=!!(data&&data.length);
    }catch(e){ GM=false; }
  }
  $('gm-pill').innerHTML=GM?'<span class="btn btn-gold" style="cursor:default">✏ GM editing on</span>':'';
  $('show-hidden-wrap').style.display=GM?'inline-flex':'none';

  const rows=[];
  try{
    for(let from=0;;from+=200){
      const {data,error}=await sb.from('game_records').select('*').order('finished_at',{ascending:false}).range(from,from+199);
      if(error) throw error;
      rows.push(...(data||[]));
      if(!data||data.length<200) break;
    }
  }catch(e){
    $('spinner').style.display='none'; $('main').style.display='block';
    msg.innerHTML='<div class="msg-error"><strong>The Hall of Fame could not be read.</strong> '+esc(e.message||e)+
      '<br>If you are the Game Master, open the GM portal — the game list shows the one statement to run in Supabase that creates the <code>game_records</code> table.</div>';
    $('body').innerHTML=''; return;
  }
  GAMES=rows.map(r=>({...r,
    setup:jp(r.setup)||{}, standings:jp(r.standings)||[], records:jp(r.records)||{}, totals:jp(r.totals)||{}}));
  // the people behind the realms, by their current name
  PEOPLE={};
  try{
    const {data:profs}=await sb.from('profiles').select('id,name');
    (profs||[]).forEach(r=>{ if(r&&r.id&&r.name) PEOPLE[r.id]=r.name; });
  }catch(e){ /* signed out, or the profiles policy does not cover this reader — snapshot names are used */ }
  msg.innerHTML = GAMES.length?'':'<div class="msg-info">No finished games have been recorded yet. A game joins the Hall of Fame the moment it ends; the GM can also add older games from the GM portal’s Stats tab.</div>';
  buildFilterOptions();
  $('spinner').style.display='none'; $('main').style.display='block';
  render();
}
function jp(v){ if(v==null) return null; if(typeof v==='string'){ try{ return JSON.parse(v); }catch(e){ return null; } } return v; }

function buildFilterOptions(){
  const opt=(sel,vals,fmt)=>{ const el=$(sel), cur=el.value; el.innerHTML=el.options[0].outerHTML+vals.map(v=>`<option value="${esc(v)}">${esc(fmt?fmt(v):v)}</option>`).join(''); el.value=cur; };
  const uniqNum=k=>[...new Set(GAMES.map(g=>g.setup[k]).filter(v=>v!=null))].sort((a,b)=>a-b);
  opt('f-bots',uniqNum('bots'));
  opt('f-realms',uniqNum('realms'));
  opt('f-humans',uniqNum('humans'));
  const maps=[...new Set(GAMES.map(mapKey).filter(Boolean))].sort();
  opt('f-map',maps);
}
function mapKey(g){ const s=g.setup||{}; return (s.cols&&s.rows)?(s.cols+'×'+s.rows):(s.mapSize||null); }

// ── FILTERING ─────────────────────────────────────────────────────────────────────────────────
function filtered(){
  const v=id=>$(id).value, q=(v('f-q')||'').trim().toLowerCase();
  const from=v('f-from')?new Date(v('f-from')+'T00:00:00'):null;
  const to=v('f-to')?new Date(v('f-to')+'T23:59:59'):null;
  const showHidden=GM&&$('f-hidden').checked;
  return GAMES.filter(g=>{
    const s=g.setup||{}, bots=s.bots||0, humans=s.humans!=null?s.humans:((s.realms||0)-bots);
    if(g.hidden&&!showHidden) return false;
    const kind=v('f-kind');
    if(kind==='human'&&bots>0) return false;
    if(kind==='withbots'&&bots<1) return false;
    if(kind==='allbot'&&humans>0) return false;
    if(kind==='mixed'&&!(bots>0&&humans>0)) return false;
    if(v('f-bots')!==''&&String(bots)!==v('f-bots')) return false;
    if(v('f-diplo')!==''&&(s.diplomacy||'normal')!==v('f-diplo')) return false;
    if(v('f-realms')!==''&&String(s.realms||'')!==v('f-realms')) return false;
    if(v('f-humans')!==''&&String(humans)!==v('f-humans')) return false;
    if(v('f-map')!==''&&mapKey(g)!==v('f-map')) return false;
    const sp=s.seaPct;
    if(v('f-sea')==='lo'&&!(sp!=null&&sp<30)) return false;
    if(v('f-sea')==='mid'&&!(sp!=null&&sp>=30&&sp<=45)) return false;
    if(v('f-sea')==='hi'&&!(sp!=null&&sp>45)) return false;
    if(v('f-vic')!==''&&(g.victory||'')!==v('f-vic')) return false;
    const t=g.turns||0;
    if(v('f-len')==='s'&&!(t<=10)) return false;
    if(v('f-len')==='m'&&!(t>10&&t<=20)) return false;
    if(v('f-len')==='l'&&!(t>20)) return false;
    if(from&&new Date(g.finished_at||0)<from) return false;
    if(to&&new Date(g.finished_at||0)>to) return false;
    if(q){
      const hay=[g.game_name,g.winner_realm,g.note].concat((g.standings||[]).map(x=>[x.realm,x.player,personName(x)].filter(Boolean).join(' '))).join(' ').toLowerCase();
      if(hay.indexOf(q)<0) return false;
    }
    return true;
  });
}
function resetFilters(){
  ['f-kind','f-bots','f-diplo','f-realms','f-humans','f-map','f-sea','f-vic','f-len'].forEach(i=>$(i).value='');
  $('f-from').value=''; $('f-to').value=''; $('f-q').value=''; if($('f-hidden')) $('f-hidden').checked=false;
  render();
}
function setTab(t){
  TAB=t;
  ['champions','achievements','peoples','games'].forEach(x=>$('tb-'+x).classList.toggle('active',x===t));
  render();
}

// ── RENDER ────────────────────────────────────────────────────────────────────────────────────
function render(){
  const G=filtered();
  $('filter-count').textContent=`${G.length} of ${GAMES.length} recorded game${GAMES.length===1?'':'s'}`;
  const el=$('body');
  if(!GAMES.length){ el.innerHTML=''; $('foot').textContent=''; return; }
  if(!G.length){ el.innerHTML='<div class="card"><div class="msg-warning">No recorded game matches these filters.</div></div>'; return; }
  if(TAB==='champions') el.innerHTML=renderChampions(G);
  else if(TAB==='achievements') el.innerHTML=renderAchievements(G);
  else if(TAB==='peoples') el.innerHTML=renderPeoples(G);
  else el.innerHTML=renderGames(G);
  const last=G.map(g=>g.finished_at).filter(Boolean).sort().slice(-1)[0];
  $('foot').textContent='Kingdoms Call — Hall of Fame v2026.10.09-1739 · most recent game recorded '+dstr(last);
}

// GM-only. Answers, on the page, the question "why are the names wrong?" — which of the three
// possible causes is in play: rows written by the old builder, no player account on the slots, or
// `profiles` unreadable.
function lbDiagnostics(G){
  const legacy=G.filter(isLegacyRow);
  let humanSlots=0, withUid=0, named=0;
  G.forEach(g=>(g.standings||[]).forEach(st=>{ if(!st||st.bot) return; humanSlots++; if(st.uid) withUid++; if(personName(st)) named++; }));
  const builds=[...new Set(G.map(g=>String(g.build||'unknown')))];
  const newest=(G.slice().sort((a,b)=>String(b.finished_at||'').localeCompare(String(a.finished_at||'')))[0]||{}).build||'—';
  const peopleN=Object.keys(PEOPLE).length;
  let warn='';
  if(legacy.length) warn+=`<div class="msg-warning" style="margin:8px 0 0"><strong>${legacy.length} of ${G.length} games were recorded by an older build of the GM portal</strong>, which stored the realm name where the player's name belongs. Those games show no player until they are rebuilt.<br>
    In the GM portal: check the footer reads <strong>v2026.09.27-1958 or later</strong> first — if it does not, hard-reload it (Ctrl/Cmd+Shift+R), because a cached copy will rebuild with the same fault. Then 📈 Stats → <strong>↻ Rebuild all</strong>.</div>`;
  if(!peopleN) warn+=`<div class="msg-warning" style="margin:8px 0 0"><strong>No player names could be read from the <code>profiles</code> table on this page</strong> — names stored with each game are being used instead. If you are signed out, sign in to the player or GM portal in this browser first. If you are signed in, the <code>profiles</code> table needs a SELECT policy covering this account.</div>`;
  if(peopleN&&withUid&&!named) warn+=`<div class="msg-warning" style="margin:8px 0 0"><strong>${withUid} player slots carry an account, but none of them matches a row in <code>profiles</code>.</strong> Those accounts have no profile row, or no name in it. Each player can set one with <strong>✏ Change Display Name</strong> in the player portal; you can set it here with the ✏ beside their line once they appear.</div>`;
  return `<div class="card"><h2>🔧 Diagnostics <span class="muted" style="font-weight:400">— only you see this</span></h2>
    <table class="kc">
      <tr><th>Games on the board</th><td class="num">${G.length}</td><td class="muted">${legacy.length} recorded by an older build</td></tr>
      <tr><th>Newest row built by</th><td colspan="2"><code>${esc(newest)}</code></td></tr>
      <tr><th>Builds present</th><td colspan="2" class="muted">${esc(builds.join(' · '))}</td></tr>
      <tr><th>Human realms</th><td class="num">${humanSlots}</td><td class="muted">${withUid} carry a player account · ${named} resolve to a name</td></tr>
      <tr><th>Names read from profiles</th><td class="num">${peopleN}</td><td class="muted">${peopleN?'read live, so a rename shows everywhere at once':'falling back to the name stored with each game'}</td></tr>
    </table>${warn}</div>`;
}
function winnerName(g){
  const st=(g.standings||[]).find(x=>x&&x.winner);
  return (st&&personName(st))||g.winner_player||null;
}
function pctBar(n,d){ const p=d?Math.round(100*n/d):0; return `<div class="bar" title="${p}%"><i style="width:${p}%"></i></div>`; }

// —— CHAMPIONS ————————————————————————————————————————————————————————————————————————————————
function renderChampions(G){
  // One line per PERSON, keyed on their account id — not on a realm name and not on the name they
  // happened to be using at the time. A player who ruled Aranthia, then the Vale, then Karn is one
  // champion with three realms listed, and renaming themselves moves the whole line.
  const byPlayer={};
  G.forEach(g=>(g.standings||[]).forEach(st=>{
    if(!st||st.bot) return;
    const nm=personName(st);
    const key=st.uid||(nm?('name:'+nm):null); if(!key) return;
    const a=byPlayer[key]=byPlayer[key]||{key,uid:st.uid||null,name:nm||'(name not recorded)',
      games:0,wins:0,podium:0,rankSum:0,ranked:0,score:0,best:0,titles:0,realms:new Set()};
    a.games++; if(st.winner) a.wins++;
    if(st.rank){ a.ranked++; a.rankSum+=st.rank; if(st.rank<=3) a.podium++; }
    a.score+=st.score||0; a.best=Math.max(a.best,st.score||0);
    a.titles+=(st.titles||[]).length;
    if(st.realm) a.realms.add(st.realm);
  }));
  const rows=Object.values(byPlayer).sort((a,b)=>b.wins-a.wins||(b.wins/b.games)-(a.wins/a.games)||b.score-a.score);
  let html='';
  if(GM) html+=lbDiagnostics(G);
  html+='<div class="card"><h2>🏆 Champions — the players</h2>';
  html+='<div class="muted" style="margin-bottom:9px">One line per person, however many realms they have ruled. Realm names change from game to game; the player does not.'+(GM?' As a Game Master you can correct a player’s name here — it changes their name everywhere on the board, past games included.':'')+'</div>';
  if(!rows.length) html+='<div class="msg-info">No human players in the games that match these filters.</div>';
  else{
    html+='<table class="kc" id="champ-table"><tr><th>#</th><th>Player</th><th class="num">Games</th><th class="num">Wins</th><th>Win rate</th><th class="num">Top 3</th><th class="num">Avg rank</th><th class="num">Best score</th><th class="num">Titles</th><th>Realms ruled</th>'+(GM?'<th></th>':'')+'</tr>';
    rows.forEach((r,i)=>{
      const rl=[...r.realms];
      html+=`<tr><td>${i+1}</td><td><strong>${esc(r.name)}</strong></td><td class="num">${r.games}</td><td class="num">${r.wins}</td>`
        +`<td style="min-width:90px">${pctBar(r.wins,r.games)}<span class="muted">${Math.round(100*r.wins/r.games)}%</span></td>`
        +`<td class="num">${r.podium}</td><td class="num">${r.ranked?(r.rankSum/r.ranked).toFixed(1):'—'}</td>`
        +`<td class="num">${nf(r.best)}</td><td class="num">${r.titles}</td>`
        +`<td class="muted">${esc(rl.slice(0,4).join(', '))}${rl.length>4?' +'+(rl.length-4):''}</td>`
        +(GM?`<td>${r.uid?`<button class="btn btn-ghost" style="font-size:.6rem;padding:3px 8px" onclick="renamePlayer('${esc(r.uid)}')">✏</button>`:'<span class="muted" title="This player has no account on record — nothing to rename">—</span>'}</td>`:'')
        +'</tr>';
    });
    html+='</table><div id="rename-msg"></div>';
  }
  html+='</div>';

  // humans vs bots
  let hG=0,hW=0,bG=0,bW=0;
  G.forEach(g=>(g.standings||[]).forEach(st=>{ if(st.bot){bG++; if(st.winner)bW++;} else {hG++; if(st.winner)hW++;} }));
  html+='<div class="card"><h2>⚖ Humans against the bots</h2><table class="kc">'
    +'<tr><th>Side</th><th class="num">Realms played</th><th class="num">Wins</th><th>Win rate</th></tr>'
    +`<tr><td>Human realms</td><td class="num">${hG}</td><td class="num">${hW}</td><td style="min-width:110px">${pctBar(hW,hG)}<span class="muted">${hG?Math.round(100*hW/hG):0}%</span></td></tr>`
    +`<tr><td>Bot realms</td><td class="num">${bG}</td><td class="num">${bW}</td><td>${pctBar(bW,bG)}<span class="muted">${bG?Math.round(100*bW/bG):0}%</span></td></tr>`
    +'</table><div class="muted" style="margin-top:7px">A win rate is per realm, so in a fair four-realm race every realm sits at 25%.</div></div>';

  // best single performances
  const perf=[];
  G.forEach(g=>(g.standings||[]).forEach(st=>perf.push({g,st})));
  perf.sort((a,b)=>(b.st.score||0)-(a.st.score||0));
  html+='<div class="card"><h2>⭐ Finest single campaigns</h2><table class="kc">'
    +'<tr><th>#</th><th>Realm</th><th>Player</th><th class="num">Score</th><th class="num">Provinces</th><th class="num">Strength</th><th class="num">Titles</th><th>Game</th><th>Date</th></tr>';
  perf.slice(0,20).forEach((p,i)=>{
    html+=`<tr><td>${i+1}</td><td><strong>${esc(p.st.realm)}</strong>${p.st.winner?'<span class="pill pill-green">won</span>':''}</td>`
      +`<td>${p.st.bot?'<span class="pill pill-grey">bot</span>':esc(personName(p.st)||'—')}</td>`
      +`<td class="num">${nf(p.st.score)}</td><td class="num">${nf(p.st.prov)}</td><td class="num">${nf(p.st.str)}</td><td class="num">${(p.st.titles||[]).length}</td>`
      +`<td class="muted">${esc(p.g.game_name)}</td><td class="muted">${dstr(p.g.finished_at)}</td></tr>`;
  });
  html+='</table></div>';
  return html;
}

// —— ACHIEVEMENTS ——————————————————————————————————————————————————————————————————————————————
function renderAchievements(G){
  const byKey={};
  G.forEach(g=>{
    Object.entries(g.records||{}).forEach(([k,r])=>{
      if(!r||r.v==null) return;
      (byKey[k]=byKey[k]||[]).push({...r,g});
    });
  });
  const cats={};
  Object.keys(byKey).forEach(k=>{ const d=achDef(k); (cats[d.c]=cats[d.c]||[]).push(k); });
  let html='';
  html+='<div class="card"><h2>🎖 Achievements</h2><div class="muted">Every record below is the best that has ever been recorded in a game matching your filters. Each game contributes its own best, so one runaway campaign cannot fill a whole list.</div></div>';
  KC_CAT.forEach(([cat,title])=>{
    const keys=(cats[cat]||[]).sort((a,b)=>achLabel(a,byKey[a][0]).localeCompare(achLabel(b,byKey[b][0])));
    if(!keys.length) return;
    html+=`<div class="card"><h2>${title}</h2><div class="ach-grid">`;
    keys.forEach(k=>{
      const def=achDef(k), dir=(byKey[k][0].d==='min'||def.d==='min')?'min':'max';
      const list=byKey[k].slice().sort((a,b)=>dir==='min'?a.v-b.v:b.v-a.v).slice(0,8);
      html+=`<div class="ach"><div class="t">${esc(achLabel(k,list[0]))}</div>`;
      if(def.n) html+=`<div class="n">${def.n}</div>`;
      html+='<ol>';
      list.forEach((e,i)=>{
        const id=whoOf(e);
        const who=e.who?esc(e.who)+' · ':'';
        const realm=id.realm?esc(id.realm):(e.pi==null?'<span class="muted">the game itself</span>':'—');
        const owner=id.player?' <span class="muted">('+esc(id.player)+')</span>':(id.bot?' <span class="pill pill-grey">bot</span>':'');
        const bits=[];
        if(id.race) bits.push(esc(id.race));
        if(id.al) bits.push(esc(id.al));
        if(e.t!=null) bits.push('turn '+e.t);
        if(e.det) bits.push(esc(e.det));
        bits.push(esc(e.g.game_name)+' · '+dstr(e.g.finished_at));
        html+=`<li class="${i===0?'top1':''}"><span class="v">${fmtVal(e.v,def.f)}</span><span class="w">${who}${realm}${owner}<span class="sm">${bits.join(' · ')}</span></span></li>`;
      });
      html+='</ol></div>';
    });
    html+='</div></div>';
  });
  return html;
}

// —— RACES & CREEDS ————————————————————————————————————————————————————————————————————————————
function renderPeoples(G){
  const tally=(pick)=>{
    const m={};
    G.forEach(g=>(g.standings||[]).forEach(st=>{
      const k=pick(st); if(!k) return;
      const a=m[k]=m[k]||{k,n:0,w:0,score:0,prov:0};
      a.n++; if(st.winner) a.w++; a.score+=st.score||0; a.prov+=st.prov||0;
    }));
    return Object.values(m).sort((a,b)=>(b.w/b.n)-(a.w/a.n)||b.n-a.n);
  };
  const tbl=(title,rows,head)=>{
    if(!rows.length) return '';
    let h=`<div class="card"><h2>${title}</h2><table class="kc"><tr><th>${head}</th><th class="num">Realms</th><th class="num">Wins</th><th>Win rate</th><th class="num">Avg score</th><th class="num">Avg provinces</th></tr>`;
    rows.forEach(r=>{
      h+=`<tr><td><strong>${esc(r.k)}</strong></td><td class="num">${r.n}</td><td class="num">${r.w}</td>`
        +`<td style="min-width:100px">${pctBar(r.w,r.n)}<span class="muted">${Math.round(100*r.w/r.n)}%</span></td>`
        +`<td class="num">${nf(Math.round(r.score/r.n))}</td><td class="num">${nf(Math.round(10*r.prov/r.n)/10)}</td></tr>`;
    });
    return h+'</table></div>';
  };
  return tbl('🧭 By race',tally(s=>s.race),'Race')
    +tbl('☯ By creed',tally(s=>s.al),'Alignment')
    +tbl('🔀 By race and creed',tally(s=>(s.race&&s.al)?(s.race+' · '+s.al):null),'Race · Alignment')
    +tbl('🎲 By how the game ended',(()=>{
        const m={}; G.forEach(g=>{ const k=g.victory||'unfinished'; const a=m[k]=m[k]||{k,n:0,w:0,score:0,prov:0}; a.n++; a.w+=0; a.score+=g.turns||0; a.prov+=(g.setup.realms||0); });
        return Object.values(m).map(a=>({k:a.k,n:a.n,w:0,score:a.score,prov:a.prov})).sort((a,b)=>b.n-a.n);
      })(),'Victory');
}

// —— GAMES ————————————————————————————————————————————————————————————————————————————————————
function renderGames(G){
  let html='<div class="card"><h2>📜 Every recorded game</h2>';
  html+='<div class="muted" style="margin-bottom:9px">Newest first. Click a game to see its final standings.'+(GM?' As a Game Master you can rename a game, change its date, add a note, hide it from the board, or delete it.':'')+'</div>';
  html+='<table class="kc"><tr><th>Date</th><th>Game</th><th class="num">Turns</th><th>Realms</th><th>Bots</th><th>Map</th><th>Won by</th><th>How</th>'+(GM?'<th></th>':'')+'</tr>';
  G.forEach(g=>{
    const s=g.setup||{}, bots=s.bots||0, humans=s.humans!=null?s.humans:((s.realms||0)-bots);
    const dip=(s.diplomacy==='hostile')?'<span class="pill pill-red">aggressive</span>':(bots?'<span class="pill pill-grey">normal</span>':'');
    html+=`<tr class="gamerow${g.hidden?' hidden-row':''}" onclick="toggleGame('${esc(g.game_id)}')">`
      +`<td class="muted">${dstr(g.finished_at)}</td>`
      +`<td><strong>${esc(g.game_name)}</strong>${g.hidden?'<span class="pill pill-amber">hidden</span>':''}${g.note?'<span class="sm muted"> · '+esc(g.note)+'</span>':''}</td>`
      +`<td class="num">${g.turns||'—'}</td>`
      +`<td>${s.realms||'—'} <span class="muted">(${humans}👤 ${bots}🤖)</span></td>`
      +`<td>${bots?bots+dip:'<span class="pill pill-green">all human</span>'}</td>`
      +`<td class="muted">${esc(mapKey(g)||'—')}${s.seaPct!=null?' · '+s.seaPct+'% sea':''}</td>`
      +`<td>${esc(g.winner_realm||'—')}${winnerName(g)?' <span class="muted">('+esc(winnerName(g))+')</span>':(g.winner_is_bot?' <span class="pill pill-grey">bot</span>':'')}</td>`
      +`<td class="muted">${esc(g.victory||'—')}</td>`
      +(GM?`<td><button class="btn btn-ghost" style="font-size:.6rem;padding:3px 8px" onclick="event.stopPropagation();toggleEdit('${esc(g.game_id)}')">✏</button></td>`:'')
      +'</tr>';
    html+=`<tr id="det-${esc(g.game_id)}" style="display:none"><td colspan="${GM?9:8}">${gameDetail(g)}</td></tr>`;
  });
  html+='</table></div>';
  return html;
}
function gameDetail(g){
  let h='<div style="padding:4px 0 8px">';
  h+='<table class="kc"><tr><th class="num">Rank</th><th>Realm</th><th>Player</th><th>Race</th><th>Creed</th><th class="num">Score</th><th class="num">Provinces</th><th class="num">Gold</th><th class="num">Strength</th><th class="num">Titles</th><th>Fate</th></tr>';
  (g.standings||[]).forEach(st=>{
    h+=`<tr><td class="num">${st.rank||'—'}</td><td><strong>${esc(st.realm)}</strong>${st.winner?'<span class="pill pill-green">victor</span>':''}</td>`
      +`<td>${st.bot?'<span class="pill pill-grey">bot</span>':esc(personName(st)||'—')}</td><td>${esc(st.race||'—')}</td><td>${esc(st.al||'—')}</td>`
      +`<td class="num">${nf(st.score)}</td><td class="num">${nf(st.prov)}</td><td class="num">${nf(st.gold)}</td><td class="num">${nf(st.str)}</td><td class="num">${(st.titles||[]).length}</td>`
      +`<td class="muted">${st.outHow?esc(st.outHow)+(st.outTurn?' turn '+st.outTurn:''):'survived'}</td></tr>`;
  });
  h+='</table>';
  const t=g.totals||{};
  h+=`<div class="muted" style="margin-top:7px">${nf(t.battles||0)} battles · ${nf(t.casualties||0)} units destroyed · ${nf(t.captures||0)} provinces changed hands · ${nf(t.lairs||0)} lair fights · ${nf(t.spells||0)} spells cast · ${nf(t.deaths||0)} characters killed · started ${dstr(g.started_at)}${GM?' · recorded by <code>'+esc(g.build||'unknown')+'</code>':''}</div>`;
  if(GM){
    const d=(g.finished_at||'').slice(0,10);
    h+=`<div class="gmbox" id="edit-${esc(g.game_id)}" style="display:none">
      <h4>Game Master — edit this record</h4>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px">
        <div><label>Name on the board</label><input type="text" id="e-name-${esc(g.game_id)}" value="${esc(g.game_name)}"></div>
        <div><label>Date played</label><input type="date" id="e-date-${esc(g.game_id)}" value="${esc(d)}"></div>
        <div style="grid-column:1/-1"><label>Note</label><input type="text" id="e-note-${esc(g.game_id)}" value="${esc(g.note||'')}" placeholder="e.g. the first Reckoning played to the wire"></div>
      </div>
      <div style="display:flex;gap:7px;flex-wrap:wrap;margin-top:9px">
        <button class="btn btn-gold" style="font-size:.66rem" onclick="saveGame('${esc(g.game_id)}')">Save</button>
        <button class="btn btn-ghost" style="font-size:.66rem" onclick="setHidden('${esc(g.game_id)}',${g.hidden?'false':'true'})">${g.hidden?'👁 Show on the board':'🚫 Hide from the board'}</button>
        <button class="btn btn-crimson" style="font-size:.66rem;margin-left:auto" onclick="deleteRecord('${esc(g.game_id)}',false)">🗑 Remove from the board</button>
        <button class="btn btn-crimson" style="font-size:.66rem" onclick="deleteRecord('${esc(g.game_id)}',true)">☠ Delete all of its data</button>
      </div>
      <div class="muted" style="margin-top:6px"><strong>Remove from the board</strong> deletes this Hall-of-Fame entry only; the game’s recorded turns stay, so the GM portal can rebuild it. <strong>Delete all of its data</strong> also deletes its recorded turns and results — that cannot be undone and the entry can never come back.</div>
      <div id="e-msg-${esc(g.game_id)}"></div>
    </div>`;
  }
  return h+'</div>';
}
function toggleGame(id){ const r=$('det-'+id); if(r) r.style.display=(r.style.display==='none'?'table-row':'none'); }
function toggleEdit(id){
  const r=$('det-'+id); if(r&&r.style.display==='none') r.style.display='table-row';
  const b=$('edit-'+id); if(b) b.style.display=(b.style.display==='none'?'block':'none');
}
async function saveGame(id){
  const msg=$('e-msg-'+id);
  const name=$('e-name-'+id).value.trim(), note=$('e-note-'+id).value.trim(), date=$('e-date-'+id).value;
  const patch={game_name:name||null, note:note||null};
  if(date) patch.finished_at=new Date(date+'T12:00:00').toISOString();
  const {error}=await sb.from('game_records').update(patch).eq('game_id',id);
  if(error){ msg.innerHTML='<div class="msg-error">'+esc(error.message)+'</div>'; return; }
  msg.innerHTML='<div class="msg-success">Saved.</div>';
  const g=GAMES.find(x=>x.game_id===id); if(g) Object.assign(g,patch);
  setTimeout(()=>render(),500);
}
async function setHidden(id,hide){
  const {error}=await sb.from('game_records').update({hidden:hide}).eq('game_id',id);
  if(error){ alert(error.message); return; }
  const g=GAMES.find(x=>x.game_id===id); if(g) g.hidden=hide;
  render();
}
// ── GM: correct a player's name ───────────────────────────────────────────────────────────────
// Writes `profiles.name`, the one place a person's name lives. Nothing in game_records is
// rewritten: the board reads names live, so the change shows on every past game at once. A GM
// needs an UPDATE policy on `profiles` covering other people's rows; the default policy usually
// only lets an account edit itself, so the exact statement is shown if the write is refused.
const KC_PROFILE_SQL=`drop policy if exists "gm rename players" on public.profiles;
create policy "gm rename players" on public.profiles
  for update to authenticated
  using (exists (select 1 from public.games g where g.gm_user_id = auth.uid()))
  with check (exists (select 1 from public.games g where g.gm_user_id = auth.uid()));`;
async function renamePlayer(uid){
  const cur=PEOPLE[uid]||'';
  const name=prompt('Player name on the leaderboard.\n\nThis is the person, not their realm — it changes on every game they have played.',cur);
  if(name==null) return;
  const t=name.trim();
  const msg=$('rename-msg');
  if(!t){ if(msg) msg.innerHTML='<div class="msg-warning">A player needs a name — nothing changed.</div>'; return; }
  const {error}=await sb.from('profiles').update({name:t}).eq('id',uid);
  if(error){
    if(msg) msg.innerHTML='<div class="msg-error"><strong>Could not rename that player.</strong> '+esc(error.message)+
      '<br>Most likely the <code>profiles</code> table only lets an account edit its own row. To let any Game Master correct a name, run this once in Supabase → SQL Editor:'+
      '<textarea readonly onclick="this.select()" style="width:100%;height:92px;font-family:monospace;font-size:.7rem;margin:6px 0 0;background:#fdf8ee">'+esc(KC_PROFILE_SQL)+'</textarea></div>';
    return;
  }
  PEOPLE[uid]=t;
  render();
  const m2=$('rename-msg'); if(m2) m2.innerHTML='<div class="msg-success">Renamed to '+esc(t)+' — on every game they have played.</div>';
}
async function deleteRecord(id,purge){
  const g=GAMES.find(x=>x.game_id===id);
  const nm=g?g.game_name:id;
  const q=purge
    ? `Delete EVERYTHING recorded about “${nm}” — its Hall-of-Fame entry, its result rows and every recorded turn? This cannot be undone.`
    : `Remove “${nm}” from the Hall of Fame? Its recorded turns are kept, so the GM portal can rebuild the entry later.`;
  if(!confirm(q)) return;
  let err=null;
  const r1=await sb.from('game_records').delete().eq('game_id',id); err=err||r1.error;
  if(purge){
    const r2=await sb.from('game_results').delete().eq('game_id',id); err=err||r2.error;
    const r3=await sb.from('turn_events').delete().eq('game_id',id); err=err||r3.error;
  }
  if(err){ alert(err.message); return; }
  GAMES=GAMES.filter(x=>x.game_id!==id);
  buildFilterOptions(); render();
}

loadAll();
