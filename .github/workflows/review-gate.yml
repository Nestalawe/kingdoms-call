# Theo's review gate (decision D-07). A PR that changes a path in .github/review-gate-paths, or has
# the label needs-theo, needs Theo's approval of its latest commit (Toby's, when Theo opened the PR).
# Branch protection on main requires the check named "review-gate".
#
# It never checks out or runs the PR's code. The script and the paths list come from the PR's base
# commit, so a PR can't loosen its own gate; the PR itself is only read through the API.
name: Review gate

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  pull-requests: read

# A newer event on the same PR replaces a check still running.
concurrency:
  group: review-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review-gate:
    name: review-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          sparse-checkout: |
            .nvmrc
            .github/review-gate-paths
            .github/scripts/review-gate.js
          sparse-checkout-cone-mode: false

      # The PR that adds the gate has nothing trusted to run yet, so it fails closed.
      - name: Check the base branch has the gate
        run: |
          if [ ! -f .github/scripts/review-gate.js ] || [ ! -f .github/review-gate-paths ]; then
            echo "::error title=review-gate::The base branch doesn't have the review gate yet, so this PR can't be checked."
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Decide
        run: node .github/scripts/review-gate.js
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
