# Runs npm test on every pull request. Branch protection on main requires the check named "ci".
# deploy.yml calls this workflow before every publish, so each commit that goes live is tested first,
# and a merge runs the tests once (inside Deploy), not twice. That's why there's no push trigger here.
name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Only Chromium is used by the tests.
      - run: npx playwright install --with-deps chromium

      - run: npm test
