# Runs every check on every pull request, in jobs side by side, so the fastest failure shows first (P1-01c):
#   static         the type check, lint, format check, ratchet and the static tests (a minute or less)
#   unit-scenario  the unit and scenario tests;  simulation;  page   (npm test, one Vitest project or two each)
#   browser        the browser specs in Chromium (npx playwright test)
#   balance        the balance matrix (P1-02b), played only when an engine path changed (tools/balance/engine-paths.ts)
#   db             the database's access-rule tests (pgTAP) and its function lint
# and "ci", which passes only when every job but db passed. Branch protection on main requires "ci" and "db", so
# those two names must not change; the other jobs can be added to or split without touching the settings.
# deploy.yml calls this workflow before every publish and waits for the whole run, so each commit that goes live is
# tested first, and a merge runs the tests once (inside Deploy), not twice. That's why there's no push trigger here.
name: CI

# A label added or removed runs it again: the balance job checks a refactor-only pull request (its label is read from
# the event, so a run before the label was added can't count for it).
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_call:

permissions:
  contents: read

jobs:
  static:
    name: static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # engine-strict (.npmrc): stops here if Node isn't exactly .nvmrc's version.
      - id: install
        run: npm ci

      # Each check runs even when one before it failed, so one run shows every problem.
      - run: npm run typecheck

      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint

      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run format:check

      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run ratchet

      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm test -- --project static

  unit-scenario:
    name: unit and scenario tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm test -- --project unit --project scenario

  simulation:
    name: simulation tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm test -- --project simulation

  page:
    name: page tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm test -- --project page

  browser:
    name: browser specs
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Playwright's Chromium is kept between runs, one copy per Playwright version. The system libraries it needs
      # are installed every time (they aren't in the cache).
      - id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - id: browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - run: npx playwright test

      # A failing spec keeps its trace: download it from the run's page, then npx playwright show-trace <file>.
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  # The balance matrix (plan P1-02, Decisions), a key control for the engine refactor. The first step, in plain Node
  # (before npm ci), compares this commit with the one before it: a pull request's base (HEAD^1 of GitHub's merge
  # commit), or, in deploy.yml's run on main, the commit before the push. If no engine path changed, the job ends
  # there. Otherwise it plays the 60 games (one per core) and fails if any differs from the committed baseline
  # (tests/balance/baseline/): a change meant to change play commits its new baseline (npm run balance:update). A pull
  # request labelled refactor-only fails at the first step if it changes the baseline at all. Only the branch is
  # played: the base branch's figures are its committed baseline.
  balance:
    name: balance matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 2

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - id: engine
        run: node tools/balance/engine-paths.ts
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          REFACTOR_ONLY: ${{ contains(github.event.pull_request.labels.*.name, 'refactor-only') }}

      - if: steps.engine.outputs.play == 'true'
        run: npm ci

      - if: steps.engine.outputs.play == 'true'
        run: npm run balance

  # The required check. It runs even when a job before it failed or the run was cancelled (a skipped required check
  # would count as passed), and passes only if every job it needs passed.
  ci:
    name: ci
    needs: [static, unit-scenario, simulation, page, browser, balance]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'length == 6 and all(.[]; .result == "success")' > /dev/null

  # pgTAP against a throwaway local database built from supabase/migrations/ (no other Supabase
  # services, no secrets, never the live or staging database). See supabase/README.md.
  db:
    name: db
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 2

      # A merged migration may already be applied, so it never changes; a new one must sort after the rest
      # (.github/scripts/migrations.js). Pull requests only: HEAD is GitHub's merge commit with the base.
      - if: github.event_name == 'pull_request'
        run: node .github/scripts/migrations.js pr-check

      - uses: supabase/setup-cli@v3
        with:
          version: 2.120.0

      - id: start
        run: supabase db start

      # The database's functions, checked as written (plpgsql_check): a column or table that doesn't exist, a type
      # that doesn't fit. Clean at warning level when it was added (P1-01c), so any finding fails.
      - run: supabase db lint --local --level warning --fail-on warning

      - if: ${{ !cancelled() && steps.start.outcome == 'success' }}
        run: supabase test db --local supabase/tests
