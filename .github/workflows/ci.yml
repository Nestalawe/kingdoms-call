# Runs the static checks and npm test (job "ci") and the database's access-rule tests (job "db") on every pull request.
# Branch protection on main requires both checks, "ci" and "db".
# deploy.yml calls this workflow before every publish, so each commit that goes live is tested first,
# and a merge runs the tests once (inside Deploy), not twice. That's why there's no push trigger here.
name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # engine-strict (.npmrc): stops here if Node isn't exactly .nvmrc's version.
      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      - run: npm run format:check

      # Only Chromium is used by the tests.
      - run: npx playwright install --with-deps chromium

      - run: npm test

  # pgTAP against a throwaway local database built from supabase/migrations/ (no other Supabase
  # services, no secrets, never the live or staging database). See supabase/README.md.
  db:
    name: db
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 2

      # A merged migration may already be applied, so it never changes; a new one must sort after the rest
      # (.github/scripts/migrations.js). Pull requests only: HEAD is GitHub's merge commit with the base.
      - if: github.event_name == 'pull_request'
        run: node .github/scripts/migrations.js pr-check

      - uses: supabase/setup-cli@v3
        with:
          version: 2.120.0

      - run: supabase db start

      - run: supabase test db --local supabase/tests
