# On main: test, then bring the live database up to date, then build site/ from src/ (npm run build, P1-05) and
# publish it to GitHub Pages (no Jekyll). Runs on a push to main, or by hand; the jobs that change anything refuse
# any other branch, so a manual run from a branch only tests. Needs Settings → Pages → Source set to "GitHub Actions".
#
# The order (P0-17, P0-33): test → migrate production → build site → deploy site. Staging isn't touched: each pull
# request was tried there, on a database rebuilt for it, before it merged (staging.yml).
# - "build" builds site/, adds the files a page cached before this deploy still names (P1-06b: the previous deploy's,
#   from its Pages artifact), and uploads it as the Pages artifact; it may only read. "deploy" publishes that artifact
#   and does nothing else: no checkout, no install, no build (P1-06a; tests/static/harness.test.ts).
# - "migrations" lists the migrations added since the commit that's live on the site, with their SQL, in its
#   job summary. With none, the migrate job is skipped and the site deploys after the tests.
# - "migrate-production" runs in the "production" environment: it waits for Toby's approval (Review
#   deployments). The summary marks a migration that changes or removes data (it needs a copy of the database
#   first); the rest lose nothing. If he rejects it, or any step fails, the site doesn't deploy.
# - It applies only what "migrations" listed, and refuses anything else (.github/scripts/migrations.js).
#   Secret: SUPABASE_DB_URL ("production").
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

# One deploy at a time, in order; never cut off a deploy that has started. A run waiting for Toby's approval
# holds the queue: later pushes wait behind it (only the newest waiting run is kept, and it includes theirs).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  migrations:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      deployments: read
      pull-requests: read
    outputs:
      changed: ${{ steps.plan.outputs.changed }}
      expected: ${{ steps.plan.outputs.expected }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - id: plan
        run: node .github/scripts/migrations.js plan
        env:
          GITHUB_TOKEN: ${{ github.token }}

  migrate-production:
    needs: [ci, migrations]
    if: needs.migrations.outputs.changed == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - uses: supabase/setup-cli@v3
        with:
          version: 2.120.0

      - run: node .github/scripts/migrations.js apply production
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          EXPECTED: ${{ needs.migrations.outputs.expected }}

  # Runs after the tests, and after production is migrated whenever there was something to migrate. It builds the
  # site the tests ran on (ci.yml): Vite, installed from the lock file (P1-09d), without its packages' install scripts:
  # the build needs none (tests/static/harness.test.ts). Then it keeps the files a page cached before this deploy still
  # names (P1-06b), read from the previous deploy's own Pages artifact. It can only read (actions: read, to find that
  # artifact), and hands site/ on as the Pages artifact, kept 30 days so the next deploy finds it.
  build:
    needs: [ci, migrations, migrate-production]
    if: >-
      !cancelled() && github.ref == 'refs/heads/main'
      && needs.ci.result == 'success' && needs.migrations.result == 'success'
      && (needs.migrations.outputs.changed != 'true' || needs.migrate-production.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --ignore-scripts

      - run: npm run build

      # The previous deploy is the newest successful run of this workflow on main; its Pages artifact is exactly the site
      # it published. With none (no run yet, or its artifact expired: the last deploy is over 30 days old, so no cached
      # page is that old), the live site is read instead. Any failure (the API, the download, a missing file) stops the
      # job here, and nothing is published (tools/deploy/keep-the-previous-deploys-files.ts).
      - name: Keep the previous deploy's files
        env:
          GH_TOKEN: ${{ github.token }}
          LIVE_SITE: https://nestalawe.github.io/kingdoms-call/
        run: |
          set -euo pipefail
          runs="repos/$GITHUB_REPOSITORY/actions/workflows/deploy.yml/runs?branch=main&status=success&per_page=20"
          run=$(gh api "$runs" --jq "[.workflow_runs[] | select(.id != $GITHUB_RUN_ID)][0].id // empty")
          artifact=""
          if [ -n "$run" ]; then
            artifacts="repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts?name=github-pages"
            artifact=$(gh api "$artifacts" --jq '[.artifacts[] | select(.expired == false)][0].id // empty')
          fi
          if [ -n "$artifact" ]; then
            echo "The previous deploy: run $run, its Pages artifact $artifact."
            gh run download "$run" -R "$GITHUB_REPOSITORY" -n github-pages -D "$RUNNER_TEMP/previous-artifact"
            mkdir "$RUNNER_TEMP/previous-site"
            tar -xf "$RUNNER_TEMP/previous-artifact/artifact.tar" -C "$RUNNER_TEMP/previous-site"
            node tools/deploy/keep-the-previous-deploys-files.ts site/ --previous "$RUNNER_TEMP/previous-site"
          else
            echo "No Pages artifact of a previous deploy: reading the live site."
            node tools/deploy/keep-the-previous-deploys-files.ts site/ --live "$LIVE_SITE"
          fi

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/
          retention-days: 30

  # Publishes the artifact the build job uploaded, once it succeeded, and only that.
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
