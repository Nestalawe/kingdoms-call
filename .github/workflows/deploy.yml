# On main: test, then bring the live database up to date, then publish site/ to GitHub Pages (no build step,
# no Jekyll). Runs on a push to main, or by hand; the jobs that change anything refuse any other branch, so a
# manual run from a branch only tests. Needs Settings → Pages → Source set to "GitHub Actions".
#
# The order (P0-17, P0-33): test → migrate production → deploy site. Staging isn't touched: each pull request
# was tried there, on a database rebuilt for it, before it merged (staging.yml).
# - "migrations" lists the migrations added since the commit that's live on the site, with their SQL, in its
#   job summary. With none, the migrate job is skipped and the site deploys after the tests.
# - "migrate-production" runs in the "production" environment: it waits for Toby's approval (Review
#   deployments), soon after the daily backup. If he rejects it, or any step fails, the site doesn't deploy.
# - It applies only what "migrations" listed, and refuses anything else (.github/scripts/migrations.js).
#   Secret: SUPABASE_DB_URL ("production").
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

# One deploy at a time, in order; never cut off a deploy that has started. A run waiting for Toby's approval
# holds the queue: later pushes wait behind it (only the newest waiting run is kept, and it includes theirs).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  migrations:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      deployments: read
      pull-requests: read
    outputs:
      changed: ${{ steps.plan.outputs.changed }}
      expected: ${{ steps.plan.outputs.expected }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - id: plan
        run: node .github/scripts/migrations.js plan
        env:
          GITHUB_TOKEN: ${{ github.token }}

  migrate-production:
    needs: [ci, migrations]
    if: needs.migrations.outputs.changed == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - uses: supabase/setup-cli@v3
        with:
          version: 2.120.0

      - run: node .github/scripts/migrations.js apply production
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          EXPECTED: ${{ needs.migrations.outputs.expected }}

  # Runs after the tests, and after production is migrated whenever there was something to migrate.
  deploy:
    needs: [ci, migrations, migrate-production]
    if: >-
      !cancelled() && github.ref == 'refs/heads/main'
      && needs.ci.result == 'success' && needs.migrations.result == 'success'
      && (needs.migrations.outputs.changed != 'true' || needs.migrate-production.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/

      - id: deployment
        uses: actions/deploy-pages@v5
