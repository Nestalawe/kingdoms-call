# Puts a pull request on the staging site (https://kingdoms-call-staging.github.io/), talking to the
# staging database, when it carries the label "staging" (P0-13). New commits on a labelled PR go up too. The site
# is built from src/ first (npm run build: Vite since P1-09d).
# One PR is on staging at a time: the newest one deployed. Its PR gets an "On staging" comment, and the
# PR it replaced is told so. Merging changes nothing on staging.
#
# Before the site goes up, the staging database is rebuilt for this PR (P0-33,
# .github/scripts/migrations.js `reset staging`): emptied (games and accounts too), rebuilt from main's
# migrations, the test accounts signed up (password: secret STAGING_TEST_PASSWORD), made-up games seeded
# (supabase/seeds/staging.sql), then this PR's own migrations applied on top and the seed run again. So a
# database change is tried before it's merged. Any failure stops the run before the site is published.
# Database address: secret STAGING_DB_URL.
#
# Only for PRs from this repo (a fork gets no secrets). Nothing is published until CI has passed on this
# commit: the job doesn't run the tests itself (CI's ci and db jobs run them on the same commit at the same
# time), it waits for their verdict (.github/scripts/staging.js wait-ci, up to 20 minutes) and stops if CI failed. The site is pushed to the staging repo with a deploy key (secret STAGING_DEPLOY_KEY), with a
# kc-config.js pointing at the staging database (variables STAGING_SUPABASE_URL, STAGING_SUPABASE_KEY),
# all in the "staging" environment. That kc-config.js also names the PR and commit, which every page's
# footer shows (public/kc-staging-footer.js).
name: Staging

on:
  pull_request:
    types: [labeled, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  checks: read

# One deploy at a time, in order; never cut off a push that has started.
concurrency:
  group: staging
  cancel-in-progress: false

jobs:
  staging:
    name: staging
    if: contains(github.event.pull_request.labels.*.name, 'staging') && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment:
      name: staging
      url: https://kingdoms-call-staging.github.io/
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Wait for CI to pass on this commit
        run: node .github/scripts/staging.js wait-ci
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}

      - uses: supabase/setup-cli@v3
        with:
          version: 2.120.0

      # main's migrations and seed, beside this PR's checkout (GitHub's merge of the PR into its base).
      - name: Check out main
        run: |
          git fetch --no-tags --depth 1 origin main
          git worktree add "$RUNNER_TEMP/main" FETCH_HEAD

      - name: Rebuild the staging database for this pull request
        run: node .github/scripts/migrations.js reset staging
        env:
          DB_URL: ${{ secrets.STAGING_DB_URL }}
          MAIN_DIR: ${{ runner.temp }}/main
          STAGING_SUPABASE_URL: ${{ vars.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_KEY: ${{ vars.STAGING_SUPABASE_KEY }}
          STAGING_TEST_PASSWORD: ${{ secrets.STAGING_TEST_PASSWORD }}

      # site/ from src/ (P1-05), as deploy.yml builds it (Vite, installed from the lock file: P1-09d); then the staging
      # config replaces its kc-config.js.
      - name: Install the build's tools
        run: npm ci

      - name: Build the site
        run: npm run build

      - name: Write the staging config
        run: node .github/scripts/staging.js config > site/kc-config.js
        env:
          STAGING_SUPABASE_URL: ${{ vars.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_KEY: ${{ vars.STAGING_SUPABASE_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}

      - name: Publish site/ to the staging repo
        id: publish
        env:
          DEPLOY_KEY: ${{ secrets.STAGING_DEPLOY_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ -z "$DEPLOY_KEY" ]; then echo "::error title=staging::The staging environment has no STAGING_DEPLOY_KEY secret."; exit 1; fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/staging_key && chmod 600 ~/.ssh/staging_key
          # GitHub's SSH host keys, from its own published list (over HTTPS), not trusted on first use. Signed in
          # with the job's token: unsigned calls share a small hourly limit with other jobs and fail with 403.
          curl -fsSL -H "Authorization: Bearer $GITHUB_TOKEN" https://api.github.com/meta | jq -r '.ssh_keys[] | "github.com " + .' > ~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/staging_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
          git clone --depth 1 git@github.com:Kingdoms-Call-Staging/kingdoms-call-staging.github.io.git staging-repo
          prev=$(jq -r '.pr // empty' staging-repo/staging.json 2>/dev/null || true)
          find staging-repo -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R site/. staging-repo/
          touch staging-repo/.nojekyll
          printf 'User-agent: *\nDisallow: /\n' > staging-repo/robots.txt
          jq -n --argjson pr "$PR_NUMBER" --arg sha "$PR_SHA" --arg at "$(date -u +%FT%TZ)" '{pr:$pr,sha:$sha,at:$at}' > staging-repo/staging.json
          cd staging-repo
          git config user.name "kingdoms-call staging"
          git config user.email "staging@users.noreply.github.com"
          git add -A
          git commit -q -m "Staging: PR #$PR_NUMBER (${PR_SHA:0:7})"
          git push -q origin HEAD:main
          echo "previous=$prev" >> "$GITHUB_OUTPUT"
          rm -f ~/.ssh/staging_key

      - name: Comment on the pull requests
        run: node .github/scripts/staging.js comment "${{ steps.publish.outputs.previous }}"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
