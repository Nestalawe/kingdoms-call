# Dependabot proposes version updates once a week, one pull request per ecosystem (P1-01a), and the npm packages the
# site loads in one of their own (P1-17b). Each is a normal pull request: CI runs, it touches a dangerous path
# (package.json or .github/), and Theo talks it through before merging.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # The site's runtime packages (supabase-js, plan P1-17b), which the pages load: a new version comes in a pull
      # request of its own, tried on staging before it merges. A package goes in the first group it matches.
      site-runtime:
        dependency-type: production
      npm:
        patterns: ['*']
    ignore:
      # Node's types follow the Node in .nvmrc: a new major comes with a new .nvmrc, by hand
      # (tests/static/harness.test.ts checks they match).
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # typescript-eslint supports TypeScript up to 6.0 (npm ci refuses 7.0). Take this out when it supports 7.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
